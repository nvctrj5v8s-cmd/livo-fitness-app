<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Lookin — Website vergleichen</title>
    <style>
      :root {
        --background: #050708;
        --surface: #0e1414;
        --surface-high: #151d1c;
        --border: #283633;
        --text: #f5f8f7;
        --muted: #98a6a1;
        --lime: #c8ff5a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100svh;
        height: 100dvh;
        overflow: hidden;
        background: var(--background);
        color: var(--text);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { font: inherit; cursor: pointer; }
      button:focus-visible, a:focus-visible {
        outline: 2px solid var(--lime);
        outline-offset: 4px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px 24px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .identity { display: flex; align-items: center; gap: 14px; }
      .brand { color: var(--lime); font-size: 24px; font-weight: 850; letter-spacing: -1.3px; }
      .identity-copy { border-left: 1px solid var(--border); padding-left: 14px; }
      h1 { margin: 0; font-size: 14px; font-weight: 650; }
      .identity-copy p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
      .controls, .links { display: flex; align-items: center; gap: 10px; }
      .segmented {
        display: flex;
        gap: 3px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--background);
      }
      .segmented button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-width: 76px;
        min-height: 36px;
        padding: 7px 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        transition: background 160ms ease, color 160ms ease;
      }
      .segmented button:hover { background: var(--surface-high); color: var(--text); }
      .versions button[aria-selected="true"] { background: var(--lime); color: var(--background); }
      .devices button[aria-pressed="true"] { background: var(--surface-high); color: var(--text); }
      svg { width: 16px; height: 16px; flex: 0 0 auto; }
      .links a {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 10px 8px;
        color: var(--muted);
        text-decoration: none;
        font-size: 12px;
        white-space: nowrap;
      }
      .links a:hover { color: var(--lime); }
      .links svg { width: 13px; height: 13px; }
      main {
        display: flex;
        flex: 1;
        min-height: 0;
        align-items: stretch;
        justify-content: center;
        padding: 12px;
        background: radial-gradient(ellipse at 50% 0, #151d1c 0, var(--background) 66%);
      }
      .viewport {
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--background);
        box-shadow: 0 20px 70px #0004;
        transition: width 240ms ease;
      }
      .viewport[data-device="mobile"] { width: 390px; }
      .panel { width: 100%; height: 100%; }
      .panel[hidden] { display: none; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--background); }
      .statusbar {
        display: flex;
        flex: 0 0 auto;
        justify-content: space-between;
        gap: 12px;
        padding: 0 24px 9px;
        color: var(--muted);
        font-size: 11px;
      }
      .statusbar p { margin: 0; }
      .status-dot { display: inline-block; width: 5px; height: 5px; margin-right: 6px; vertical-align: 2px; border-radius: 50%; background: var(--lime); }
      @media (max-width: 1100px) {
        .toolbar { gap: 10px 18px; }
        .identity-copy p { display: none; }
        .controls { gap: 8px; }
        .segmented button { min-width: 62px; padding-inline: 9px; }
      }
      @media (max-width: 760px) {
        .toolbar { padding: 10px 12px; gap: 10px 12px; }
        .identity { flex: 1; }
        .brand { font-size: 22px; }
        .identity-copy { padding-left: 10px; }
        h1 { font-size: 12px; }
        .controls { order: 3; width: 100%; justify-content: space-between; }
        .segmented { padding: 3px; }
        .segmented button { min-height: 36px; }
        .links { gap: 0; }
        .links a { padding: 8px 5px; font-size: 11px; }
        main { padding: 8px; }
        .statusbar { padding: 0 12px 7px; font-size: 10px; }
        .statusbar .hint { display: none; }
      }
      @media (max-width: 380px) {
        .identity-copy { display: none; }
        .segmented button { min-width: 57px; font-size: 11px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="identity">
        <span class="brand">lookin.</span>
        <div class="identity-copy">
          <h1>Website vergleichen</h1>
          <p>Zwei Entwürfe. Dein Eindruck entscheidet.</p>
        </div>
      </div>
      <div class="controls">
        <div class="segmented versions" role="tablist" aria-label="Website-Version">
          <button id="tab-v1" type="button" role="tab" aria-selected="false" aria-controls="panel-v1" tabindex="-1" data-version="v1">Version 1</button>
          <button id="tab-v2" type="button" role="tab" aria-selected="true" aria-controls="panel-v2" data-version="v2">Version 2</button>
        </div>
        <div class="segmented devices" role="group" aria-label="Vorschaugröße">
          <button type="button" aria-pressed="true" data-device="desktop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v3M8 20h8"/></svg>
            Desktop
          </button>
          <button type="button" aria-pressed="false" data-device="mobile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4M11 19h2"/></svg>
            Handy
          </button>
        </div>
      </div>
      <nav class="links" aria-label="Entwürfe einzeln öffnen">
        <a href="../website/dist/index.html" target="_blank" rel="noopener" aria-label="Version 1 in einem neuen Tab öffnen">V1 öffnen <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3h7v7M10 14 21 3M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a>
        <a href="../website-v2/dist/index.html" target="_blank" rel="noopener" aria-label="Version 2 in einem neuen Tab öffnen">V2 öffnen <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3h7v7M10 14 21 3M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a>
      </nav>
    </header>
    <main aria-label="Vorschau der Website">
      <div class="viewport" data-device="desktop">
        <section id="panel-v1" class="panel" role="tabpanel" aria-labelledby="tab-v1" hidden>
          <iframe src="../website/dist/index.html" title="Lookin Website — Version 1"></iframe>
        </section>
        <section id="panel-v2" class="panel" role="tabpanel" aria-labelledby="tab-v2">
          <iframe src="../website-v2/dist/index.html" title="Lookin Website — Version 2"></iframe>
        </section>
      </div>
    </main>
    <footer class="statusbar">
      <p><span class="status-dot" aria-hidden="true"></span><span id="status" role="status" aria-live="polite">Version 2 · Desktopansicht</span></p>
      <p class="hint">Beim Wechsel bleibt deine Scrollposition erhalten.</p>
    </footer>
    <script>
      (() => {
        const versionButtons = [...document.querySelectorAll('[data-version]')];
        const deviceButtons = [...document.querySelectorAll('button[data-device]')];
        const viewport = document.querySelector('.viewport');
        const status = document.getElementById('status');
        let version = 'v2';
        let device = 'desktop';

        function updateStatus() {
          status.textContent = `${version === 'v1' ? 'Version 1' : 'Version 2'} · ${device === 'mobile' ? 'Handyansicht · 390 px' : 'Desktopansicht'}`;
        }

        function selectVersion(nextVersion) {
          version = nextVersion;
          versionButtons.forEach(button => {
            const selected = button.dataset.version === version;
            button.setAttribute('aria-selected', String(selected));
            button.tabIndex = selected ? 0 : -1;
            document.getElementById(button.getAttribute('aria-controls')).hidden = !selected;
          });
          updateStatus();
        }

        versionButtons.forEach((button, index) => {
          button.addEventListener('click', () => selectVersion(button.dataset.version));
          button.addEventListener('keydown', event => {
            let nextIndex;
            if (event.key === 'ArrowRight') nextIndex = (index + 1) % versionButtons.length;
            if (event.key === 'ArrowLeft') nextIndex = (index + versionButtons.length - 1) % versionButtons.length;
            if (event.key === 'Home') nextIndex = 0;
            if (event.key === 'End') nextIndex = versionButtons.length - 1;
            if (nextIndex === undefined) return;
            event.preventDefault();
            selectVersion(versionButtons[nextIndex].dataset.version);
            versionButtons[nextIndex].focus();
          });
        });

        deviceButtons.forEach(button => {
          button.addEventListener('click', () => {
            device = button.dataset.device;
            viewport.dataset.device = device;
            deviceButtons.forEach(control => control.setAttribute('aria-pressed', String(control.dataset.device === device)));
            updateStatus();
          });
        });
      })();
    </script>
  </body>
</html>
