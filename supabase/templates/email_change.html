<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Neue E-Mail-Adresse für Lookin</title>
  </head>
  <body style="margin:0;padding:0;background-color:#050708;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#050708;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;">
            <tr>
              <td style="padding:0 4px 20px 4px;font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:900;letter-spacing:-1px;color:#F5F8F7;">
                Lookin<span style="color:#C8FF5A;">.</span>
              </td>
            </tr>
            <tr>
              <td style="background-color:#0E1414;border:1px solid #283633;border-radius:20px;padding:32px 28px;font-family:Arial,Helvetica,sans-serif;color:#F5F8F7;">
                <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;color:#F5F8F7;">Neue E-Mail-Adresse bestätigen</h1>
                <p style="margin:0 0 24px 0;font-size:15px;line-height:1.6;color:#C9D3D0;">
                  Dein Lookin-Konto soll künftig {{ .NewEmail }} statt {{ .Email }} verwenden. Bitte bestätige die Änderung.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="border-radius:14px;background-color:#C8FF5A;">
                      <a href="{{ .SiteURL }}?token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;padding:14px 26px;font-size:15px;font-weight:700;color:#050706;text-decoration:none;border-radius:14px;">Änderung bestätigen</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0 0;font-size:13px;line-height:1.6;color:#98A6A1;">
                  Das warst nicht du? Dann ignoriere diese E-Mail und ändere zur Sicherheit dein Passwort.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
