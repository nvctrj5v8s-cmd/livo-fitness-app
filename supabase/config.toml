[functions.barcode-lookup]
verify_jwt = true

[functions.ai-coach]
verify_jwt = true

[functions.account-data]
# The function verifies the bearer token with Auth.getUser itself. The legacy
# gateway JWT check can reject tokens signed by newer Supabase signing keys.
verify_jwt = false

[functions.revenuecat-webhook]
# RevenueCat cannot send a Supabase JWT. The function checks its own shared
# secret instead and rejects every other caller with 401.
verify_jwt = false

[functions.legal-actions]
# The function verifies the bearer token with Auth.getUser itself.
verify_jwt = false
