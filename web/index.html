<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lookin – AI Food Tracker: Mahlzeiten, Rezepte und Fortschritt im Blick.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lookin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lookin – AI Food Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050708">
  <script>
    // The app is never meant to be shown inside another page (clickjacking).
    if (window.top !== window.self) {
      document.documentElement.style.display = "none";
      try { window.top.location = window.self.location; } catch (_) {}
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #050708; }
    #boot {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 48px; box-sizing: border-box; background: #050708;
    }
    /* Only a quiet hint on slow connections. The centre stays empty because
       the app's start animation draws the Lookin logo there itself. */
    #boot small {
      font: 500 14px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #98a6a1; opacity: 0;
      animation: boot-hint 400ms ease-out 1500ms forwards;
    }
    @keyframes boot-hint { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #boot small { animation-duration: 1ms; }
    }
  </style>
</head>
<body>
  <!-- Dark screen until Flutter draws its first frame; Lookin then plays its
       start animation on the same background. Removed by the script below. -->
  <div id="boot" role="status" aria-label="Lookin wird geladen">
    <small>Wird geladen …</small>
  </div>
  <script>
    // Match Flutter's device-language default and its explicit override.
    (function () {
      var language = (navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en';
      try {
        var saved = localStorage.getItem('flutter.lookin.locale.v1');
        if (saved === '"en"' || saved === 'en') language = 'en';
        if (saved === '"de"' || saved === 'de') language = 'de';
      } catch (_) { /* Restricted storage: follow the device. */ }
      document.documentElement.lang = language;
      if (language === 'en') {
        var boot = document.getElementById('boot');
        boot.setAttribute('aria-label', 'Loading Lookin');
        boot.querySelector('small').textContent = 'Loading …';
        document.querySelector('meta[name="description"]').content = 'Lookin – AI Food Tracker: meals, recipes and progress at a glance.';
      }
    })();
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
