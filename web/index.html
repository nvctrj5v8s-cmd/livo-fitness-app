<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lookin – AI Food Tracker: Mahlzeiten, Rezepte und Fortschritt im Blick.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lookin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lookin – AI Food Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050708">
  <style>
    html, body { margin: 0; height: 100%; background: #050708; }
    #boot {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #050708; color: #f5f8f7;
      font: 800 30px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.5px;
    }
    #boot svg { width: 88px; height: 88px; }
    #boot small { font: 500 14px/1 system-ui, sans-serif; color: #98a6a1; letter-spacing: 0; }
  </style>
</head>
<body>
  <!-- Shown until Flutter draws its first frame, so a slow connection never
       leaves a blank or outdated screen. Removed by the script below. -->
  <div id="boot" role="status" aria-label="Lookin wird geladen">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="34" fill="none" stroke="#c8ff5a" stroke-width="9"
              stroke-linecap="round" stroke-dasharray="190 24" transform="rotate(-70 50 50)"/>
      <circle cx="50" cy="50" r="10" fill="#c8ff5a"/>
    </svg>
    <span>Lookin</span>
    <small>Wird geladen …</small>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
